base_config:     
  output_name: <simulation_name>
  scenario: <scenario_name>
  yaml_output: <boolean>
  logging_level: debug                         # logging level: debug, info, warning, error, critical, NONE
  resume: <boolean>                               # skip steps already concluded, ir false remember clean previous
  clean_previous:                            # remove result folders before running
    #- mobility 
    #- rt
    #- db
    #- coord
    #- hdf5
    #- blensor_lidar
    #- blensor_images
    #- post_lidar
    #- post_images
    #- beams

pipeline:
  mobility:
    enabled: <boolean>
    tool: sumo                                # sumo
    placement_limits: 
      enabled: <boolean>   
      max_lim: <[x,y]>                     # [x, y] study area limits for placement of Tx and Rx
      min_lim: <[x,y]>                     # [x, y] study area limits for placement of Tx and Rx
  
  ray_tracing:                                # parsing automático
    enabled: <boolean>
    #tool: wireless_insite                    # wireless_insite | none
    jump: <boolean>

  data_processing:
    enabled: <boolean>
    which: selected                               # all | selected
    outputs:                                        # ["db", "coord", "rays"]
      - db                                          # sql
      - coord                                       # coordenadas
      - rays                                        # hdf5
  
  blensor:
    enabled: <boolean>  
    outputs: 
      - lidar
      - image

  post_processing:
    enabled: <boolean>
    which: selected                               # all | selected
    outputs:                                         # ["beams", "image", "lidar"]
       - beams
       - image
       - lidar
  
  validation:
    run_checkup: <boolean>

rmt:
  enabled: <boolean>                          # false for isolated simulation
  scenes_per_episode: <integer> 
  time_between_episodes: <float>                   # This time needs to be multiple of scene time step
  sampling_parameters: <[start, end, time_step]>
  features:
    fixed_receivers: <boolean>  
    vehicles_template: <boolean>

sumo:
  seed: <integer>  
  bin: <sumo_path>
  cfg: <cfg_file_name>

ray_tracing:
  use_pedestrians: <boolean>
  use_drone:
    enabled: <boolean>
    altitude: <integer>                       #meters
  receivers_per_episode: <integer>
  transmitters_per_episode: <integer>
  v2v:
    enabled: <boolean>
    closest_vehicles: # from potential receiver vehicles in area, choose the closest ones to be Rx. 
      enabled: <boolean>
      n_of_vehicles: <integer> # Overrites receivers_per_episode
  wireless_insite:
    software_path: <remcom_path>
    LICENSE_FILE: <remcom_license>
    base_files_names:
      study_area_name: study
      tx_name: Tx
      rx_name: Rx
      setup_name: model
      vehicles_name: random-line
  
blensor_options:
  path_to_scenario_blend: <blender_scenario_path>
  path_to_vehicles_blend: <blender_vehicles_path>
  path_blensor_image: <AppImage_path>
  image_options:
    BS_camera: <boolean>
    UE_camera: <boolean>
    n_camera_BS: <integer>

data_processing:
  area_of_analyses: # only fill csv with objects within this area
    enabled: <boolean>
    limits: <[x1,y1, x2, y2]>

post_processing:
  mimo:
    import_precoding: < false | codebook_path >
    import_channels: < false | channels_path >
    import_combining: < false | codebook_path >
    antenna_array_expansion:
      Tx: <[x, y]>
      Rx: <[x, y]>
      normalized_antenna_distance: 0.5
    array_rotation:
      Tx: <[alpha, beta, gamma]>
      Rx: <[alpha, beta, gamma]>
    
  cartesian_lidar_matrix:
    coordinate_system: cartesian          # spherical | cartesian
    QP: # cartesian
      step: <[x, y, z]>               # step in x, y, z directions
      min: <[x, y, z]>                  # minimum x, y, z coordinates
      max: <[x, y, z]>                 # maximum x, y, z coordinates
    QPsph:
      step: <[x, y, z]>               # step in r, phi, theta directions
      min: <[x, y, z]>
      max: <[x, y, z]>
    Tx_position: <[x, y, z]>
    max_dist_LIDAR: <float>
    type_data: < 2D | 3D >
